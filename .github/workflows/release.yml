name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag (version) to be released (ex: 1.2.3).'
        type: string
        required: true

      create-github-release:
        description: 'Create a source-only GitHub release for the tag (no binary artifacts). SPM consumers build from source via this tag. If the provided `tag` does not exist, it will be created.'
        type: boolean
        required: true
        default: true

jobs:
  release:
    permissions:
        contents: write
    uses: shushinde/aepsdk-commons/.github/workflows/ios-spm-release.yml@main
    with:
      tag: ${{ github.event.inputs.tag }}
      xcode-version: '26.3.0'
      # Pure-SPM, source-only distribution: no CocoaPods and no XCFramework binary.
      # SPM consumers resolve this git tag and build AEPCore & friends from source.
      create-github-release: ${{ github.event.inputs.create-github-release == 'true' && 'AEPServices, AEPCore, AEPIdentity, AEPLifecycle, AEPSignal' || '' }}
      tag-only: true
      simulator-platforms: 'iOS, tvOS'
      version-validation-paths: >
        AEPCore.xcodeproj/project.pbxproj,
        AEPCore/Sources/configuration/ConfigurationConstants.swift,
        AEPIdentity/Sources/IdentityConstants.swift,
        AEPLifecycle/Sources/LifecycleConstants.swift,
        AEPSignal/Sources/SignalConstants.swift
    secrets: inherit
